[pytest]
addopts = -v -s

markers =
    api:接口测试
    ui:ui测试
    login:登录测试
    order:订单测试
    pay:支付测试
    register:注册测试
    product:商品测试
    positive:正向测试
    negative:异常测试
    order:订单测试
    ddt:数据驱动
    concurrent:并发测试
    security:安全测试



#日志配置
#日志文件放在什么地方
log_file = ./logs/pytest.log
#日志等级，超过等级记录，不超过不记录
log_file_level = info
#日志格式
log_file_format = %(levelname)-8s %(asctime)s [%(name)s:%(lineno)s] : %(message)s
log_file_date_format = %Y-%m-%d %H:%M-%S

#记录用例执行结果
result_log_enable = 1
#记录用例分割线
result_log_separator = 1
#分割线等级
result_log_level_separator = warning
#异常消息等级
result_log_level_verbose = info

log_cli = true
log_cli_level = INFO
